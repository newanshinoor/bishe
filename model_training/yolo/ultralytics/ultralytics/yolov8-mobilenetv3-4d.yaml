# YOLOv8-MobileNetV3 4通道轻量化多模态架构 (修复参数过载版)

nc: 25  # 类别数 (后面训练时会自动覆盖)
ch: 4   # <--- 新增：显式声明输入为 4 通道，这是多模态输入必须的关键参数

scales:
  n: [0.33, 0.25, 1024]

# Backbone (主干网络)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]                  # 0-P1/2

  # Bneck 参数说明: [out_ch, expand_ch, kernel, stride, use_se, act]
  - [-1, 1, Bneck, [16, 16, 3, 1, False, False]]  # 1
  - [-1, 1, Bneck, [24, 64, 3, 2, False, True]]   # 2-P2/4
  - [-1, 1, Bneck, [24, 72, 3, 1, False, True]]   # 3
  - [-1, 1, Bneck, [40, 72, 5, 2, True, True]]    # 4-P3/8
  - [-1, 1, Bneck, [40, 120, 5, 1, True, True]]   # 5
  - [-1, 1, Bneck, [40, 120, 5, 1, True, True]]   # 6 (P3特征层结束)
  - [-1, 1, Bneck, [80, 240, 3, 2, False, False]] # 7-P4/16
  - [-1, 1, Bneck, [80, 200, 3, 1, False, False]] # 8
  - [-1, 1, Bneck, [80, 184, 3, 1, False, False]] # 9
  - [-1, 1, Bneck, [80, 184, 3, 1, False, False]] # 10
  - [-1, 1, Bneck, [112, 480, 3, 1, True, False]] # 11
  - [-1, 1, Bneck, [112, 672, 3, 1, True, False]] # 12 (P4特征层结束)
  - [-1, 1, Bneck, [160, 672, 5, 2, True, False]] # 13-P5/32
  - [-1, 1, Bneck, [160, 960, 5, 1, True, False]] # 14
  - [-1, 1, Bneck, [160, 960, 5, 1, True, False]] # 15
  - [-1, 1, SPPF, [1024, 5]]                      # 16 (P5特征层结束)

# Head (头部，保持 YOLOv8 原生设计)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 12], 1, Concat, [1]]  # 18: cat backbone P4 (从 10 修正为 12，获取完整的 P4 语义信息)
  - [-1, 3, C2f, [512]]         # 19

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]   # 21: cat backbone P3
  - [-1, 3, C2f, [256]]         # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]  # 24: cat head P4
  - [-1, 3, C2f, [512]]         # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]  # 27: cat head P5
  - [-1, 3, C2f, [1024]]        # 28 (P5/32-large)

  - [[22, 25, 28], 1, Detect, [nc]]  # 29: Detect(P3, P4, P5)